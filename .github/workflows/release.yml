name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Verify tag matches manifest version
        run: |
          node -e "const m=require('./manifest.json'); if (process.env.GITHUB_REF_NAME !== m.version) { throw new Error('Tag must match manifest version') }"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css

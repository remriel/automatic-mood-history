name: Release

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:mobile
      - run: npm run audit:release
      - run: npm run test:layout
      - run: npm run test:mobile-layout
      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          test -s "docs/RELEASE_NOTES_$version.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node -e "const m=require('./manifest.json'); if (process.env.GITHUB_REF_NAME !== m.version) { throw new Error('Tag must match manifest version') }"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train Moodring model from pinned source
        run: bash scripts/build-moodring-model.sh
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            moodring-model.bin
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES_${{ steps.version.outputs.value }}.md
          files: |
            main.js
            manifest.json
            styles.css
            moodring-model.bin

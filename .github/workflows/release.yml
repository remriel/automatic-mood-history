name: Release

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run audit:release
      - run: npm run test:layout
      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node -e "const m=require('./manifest.json'); if (process.env.GITHUB_REF_NAME !== m.version) { throw new Error('Tag must match manifest version') }"
          fi
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES_1.2.8.md
          files: |
            main.js
            manifest.json
            styles.css
